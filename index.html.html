<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060915">
<title>For Aarchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #060915;
    --deep: #0b1330;
    --star: #f6e7c1;
    --star-dim: #cdd6f4;
    --gold: #e8c07d;
    --lilac: #b9aee0;
    --paper: #f4efe4;
    --line: rgba(232, 192, 125, 0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 20%, #101a44 0%, var(--deep) 45%, var(--void) 100%);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    font-family:'Jost', sans-serif;
    color: var(--paper);
  }
  *{
    -webkit-tap-highlight-color: transparent;
  }
  #sky{
    position:relative;
    width:100vw;
    height:100vh;
    height: 100dvh;
    display:flex; align-items:center; justify-content:center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  canvas#bg{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .title-wrap{
    position:absolute;
    top: calc(env(safe-area-inset-top) + 22px);
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:5;
    pointer-events:none;
    width: 90%;
  }
  .eyebrow{
    font-family:'Jost', sans-serif;
    font-weight:300;
    letter-spacing: 0.35em;
    font-size: 11px;
    color: var(--lilac);
    opacity:0.75;
    margin-bottom: 6px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(34px, 6vw, 58px);
    margin:0;
    color: var(--paper);
    letter-spacing: 0.02em;
  }
  .sub{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    color: var(--star-dim);
    opacity:0.8;
    font-size: 16px;
    margin-top:8px;
  }
  svg#constellation{
    position:relative;
    z-index:3;
    width: min(86vw, 58dvh, 560px);
    height: min(86vw, 58dvh, 560px);
    overflow: visible;
  }
  .link{
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 4 5;
    fill:none;
    opacity:0;
    animation: fadein 1.5s ease forwards;
  }
  .star-glow{
    fill: var(--gold);
    filter: drop-shadow(0 0 6px rgba(232,192,125,0.9)) drop-shadow(0 0 14px rgba(232,192,125,0.4));
  }
  .star-hit{
    fill: transparent;
    cursor: pointer;
  }
  .star-core{
    fill: var(--star);
    transition: r 0.25s ease;
  }
  .star-group{
    opacity:0;
    animation: popin 0.6s ease forwards;
  }
  .star-group.opened .star-core{
    fill: var(--gold);
  }
  .star-group:hover .star-core{
    r: 7;
  }
  .pulse{
    fill:none;
    stroke: var(--gold);
    stroke-width: 1;
    opacity: 0.6;
    animation: pulse 2.6s ease-out infinite;
  }
  .star-group.opened .pulse{
    animation: none;
    opacity: 0;
  }
  @keyframes pulse{
    0%{ r: 6; opacity: 0.6; }
    100%{ r: 20; opacity: 0; }
  }
  @keyframes fadein{
    to{ opacity: 1; }
  }
  @keyframes popin{
    to{ opacity: 1; }
  }
  .label{
    font-family:'Jost', sans-serif;
    font-size: 10px;
    fill: var(--star-dim);
    letter-spacing: 0.08em;
    opacity: 0.55;
    pointer-events:none;
    text-anchor: middle;
  }

  .progress{
    position:absolute;
    bottom: calc(env(safe-area-inset-bottom) + 28px);
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    gap:10px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: rgba(244,239,228,0.25);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .dot.done{
    background: var(--gold);
    transform: scale(1.3);
  }

  /* Card overlay */
  #overlay{
    position:fixed; inset:0;
    background: rgba(6,9,21,0.82);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:20;
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
  }
  #overlay.show{
    opacity:1; pointer-events:auto;
  }
  .card{
    width: min(90vw, 440px);
    background: linear-gradient(180deg, #12193a 0%, #0c1130 100%);
    border: 1px solid rgba(232,192,125,0.25);
    border-radius: 2px;
    padding: 40px 36px;
    position:relative;
    transform: translateY(14px);
    transition: transform 0.35s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  #overlay.show .card{
    transform: translateY(0);
  }
  .card-eyebrow{
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    opacity: 0.8;
    margin-bottom: 14px;
  }
  .card h2{
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 16px 0;
    color: var(--paper);
    line-height:1.2;
  }
  .card p{
    font-family:'Cormorant Garamond', serif;
    font-size: 18px;
    line-height: 1.6;
    color: var(--star-dim);
    margin:0;
  }
  .close-btn{
    position:absolute;
    top: 18px; right: 20px;
    background:none; border:none;
    color: var(--star-dim);
    font-size: 20px;
    cursor:pointer;
    opacity:0.5;
    line-height:1;
    font-family: 'Jost', sans-serif;
  }
  .close-btn:hover{ opacity:1; }

  /* Final reveal */
  #finale{
    position:fixed; inset:0;
    background: radial-gradient(ellipse at 50% 40%, #141c47 0%, var(--void) 70%);
    display:flex; align-items:center; justify-content:center;
    z-index:30;
    opacity:0; pointer-events:none;
    transition: opacity 1s ease;
    text-align:center;
    padding: 20px;
  }
  #finale.show{
    opacity:1; pointer-events:auto;
  }
  #finale .msg{
    max-width: 480px;
  }
  #finale .card-eyebrow{
    text-align:center;
  }
  #finale h2{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(24px, 4vw, 34px);
    color: var(--paper);
    line-height: 1.5;
  }
  #finale .signoff{
    margin-top: 22px;
    font-family:'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--lilac);
    opacity:0.85;
  }
  .finale-close{
    margin-top: 30px;
    background:none;
    border:1px solid rgba(232,192,125,0.4);
    color: var(--gold);
    padding: 10px 26px;
    font-family:'Jost', sans-serif;
    letter-spacing:0.1em;
    font-size: 11px;
    cursor:pointer;
    border-radius: 2px;
    background: rgba(232,192,125,0.06);
    transition: background 0.2s ease;
  }
  .finale-close:hover{
    background: rgba(232,192,125,0.15);
  }

  .hint{
    position:absolute;
    bottom: calc(env(safe-area-inset-bottom) + 62px);
    left:50%;
    transform:translateX(-50%);
    font-size: 11px;
    letter-spacing:0.08em;
    color: var(--star-dim);
    opacity:0.45;
    z-index:5;
    font-family:'Jost', sans-serif;
    text-align:center;
    width: 100%;
  }
</style>
</head>
<body>

<div id="sky">
  <canvas id="bg"></canvas>

  <div class="title-wrap">
    <div class="eyebrow">A CONSTELLATION, MAPPED FOR</div>
    <h1>Aarchi</h1>
    <div class="sub">six stars, six nights we'll have someday</div>
  </div>

  <svg id="constellation" viewBox="0 0 500 500"></svg>

  <div class="hint">tap each star</div>
  <div class="progress" id="progress"></div>
</div>

<div id="overlay">
  <div class="card">
    <button class="close-btn" onclick="closeCard()">✕</button>
    <div class="card-eyebrow" id="card-eyebrow"></div>
    <h2 id="card-title"></h2>
    <p id="card-body"></p>
  </div>
</div>

<div id="finale">
  <div class="msg">
    <div class="card-eyebrow">EVERY STAR, FOUND</div>
    <h2>You're in every one of these, Aarchi.<br>Six nights, one sky, one us.</h2>
    <div class="signoff">made for you, from wherever you are tonight</div>
    <button class="finale-close" onclick="closeFinale()">back to the sky</button>
  </div>
</div>

<script>
// ---------- Twinkling starfield background ----------
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function initStars(){
  particles = [];
  const count = Math.floor((W*H)/6000);
  for(let i=0;i<count;i++){
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.3 + 0.3,
      baseAlpha: Math.random()*0.5 + 0.2,
      speed: Math.random()*0.02 + 0.005,
      phase: Math.random()*Math.PI*2
    });
  }
}
initStars();
window.addEventListener('resize', initStars);

let t = 0;
function drawStars(){
  ctx.clearRect(0,0,W,H);
  t += 1;
  for(const p of particles){
    const alpha = p.baseAlpha + Math.sin(t*p.speed + p.phase)*0.25;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(244,239,228,${Math.max(0,alpha)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// ---------- Constellation (heart shape), 6 stars ----------
// Points laid out to form a heart, traced in order 1..6
const points = [
  {x: 250, y: 130, label: "I"},   // top dip left-ish
  {x: 140, y: 90,  label: "II"},  // left lobe top
  {x: 70,  y: 210, label: "III"}, // left side
  {x: 250, y: 400, label: "IV"},  // bottom point of heart
  {x: 430, y: 210, label: "V"},   // right side
  {x: 360, y: 90,  label: "VI"},  // right lobe top
];

// order to draw the outline of a heart shape connecting all 6 in sequence
const order = [1,2,0,3,5,4,1]; // index sequence forming heart outline back to start

const dates = [
  {
    title: "The Desert Sky",
    body: "Lying back on a blanket somewhere the city can't reach, tracing constellations with our fingers because the actual sky finally showed up for once."
  },
  {
    title: "Movie Night",
    body: "Watching some faltoo horror movie or a rom-com, but way too busy hugging and kissing to know when it started or when the credits rolled. Not bothered about the movie or what's even happening, just melting into the comfort of each other's company."
  },
  {
    title: "Shopping Date",
    body: "We go shopping in your favorite Mirdif City Center, and you drag me to all your makeup spots and use me as your personal puppet, putting makeup on me and making me look all goofy (fine, fine, pretty or whatever). Then we wander around trying on stuff, window shopping, and buying random things. Splurging continues."
  },
  {
    title: "Picnic Date",
    body: "A mat, some wine, some good food, that's all we need to just sit, yap, and stare at each other for however long we want. December seems too perfect for that, lowkey, the weather's just right for us to sit, relax, and enjoy time with each other."
  },
  {
    title: "Cooking Date",
    body: "A very fun idea where we just play around with food. I bring out my inner Masterchef Thrissur and make you your favorite Chinese food, some nice momos and dumplings, some Indo-Chinese style noodles and fried rice. While I'm cooking, you're sitting on the kitchen counter telling me about your day, and in between there's obviously some sneaky kisses and hugs. Once I'm done, I'm pretty much just going to feed you until you're full."
  },
  {
    title: "Long Drive",
    body: "Just us, a scenic road, and the music playing in the background, enjoying life and drifting through all the various places we pass by. Just us and no one else. Perfect."
  }
];

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('constellation');

// draw connecting lines first (so stars sit on top)
for(let i=0; i<order.length-1; i++){
  const a = points[order[i]];
  const b = points[order[i+1]];
  const line = document.createElementNS(svgNS, "path");
  line.setAttribute("d", `M ${a.x} ${a.y} L ${b.x} ${b.y}`);
  line.setAttribute("class", "link");
  line.style.animationDelay = (0.3 + i*0.15) + "s";
  svg.appendChild(line);
}

let openedCount = 0;
const progressEl = document.getElementById('progress');
points.forEach((p, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.id = 'dot-' + i;
  progressEl.appendChild(dot);
});

points.forEach((p, i) => {
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("class", "star-group");
  g.style.animationDelay = (1 + i*0.18) + "s";
  g.setAttribute("id", "star-" + i);

  const pulse = document.createElementNS(svgNS, "circle");
  pulse.setAttribute("cx", p.x);
  pulse.setAttribute("cy", p.y);
  pulse.setAttribute("r", 6);
  pulse.setAttribute("class", "pulse");
  pulse.style.animationDelay = (i*0.4) + "s";

  const glow = document.createElementNS(svgNS, "circle");
  glow.setAttribute("cx", p.x);
  glow.setAttribute("cy", p.y);
  glow.setAttribute("r", 3.2);
  glow.setAttribute("class", "star-core");

  const hit = document.createElementNS(svgNS, "circle");
  hit.setAttribute("cx", p.x);
  hit.setAttribute("cy", p.y);
  hit.setAttribute("r", 18);
  hit.setAttribute("class", "star-hit");
  hit.addEventListener("click", () => openCard(i));

  const label = document.createElementNS(svgNS, "text");
  label.setAttribute("x", p.x);
  label.setAttribute("y", p.y - 22);
  label.setAttribute("class", "label");
  label.textContent = p.label;

  g.appendChild(pulse);
  g.appendChild(glow);
  g.appendChild(label);
  g.appendChild(hit);
  svg.appendChild(g);
});

const overlay = document.getElementById('overlay');
function openCard(i){
  const d = dates[i];
  document.getElementById('card-eyebrow').textContent = "STAR " + (i+1) + " OF 6";
  document.getElementById('card-title').textContent = d.title;
  document.getElementById('card-body').textContent = d.body;
  overlay.classList.add('show');

  const starGroup = document.getElementById('star-' + i);
  if(!starGroup.classList.contains('opened')){
    starGroup.classList.add('opened');
    document.getElementById('dot-' + i).classList.add('done');
    openedCount++;
    if(openedCount === points.length){
      setTimeout(()=>{
        document.getElementById('finale').classList.add('show');
      }, 900);
    }
  }
}
function closeCard(){
  overlay.classList.remove('show');
}
function closeFinale(){
  document.getElementById('finale').classList.remove('show');
}
overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeCard();
});
</script>
</body>
</html>
